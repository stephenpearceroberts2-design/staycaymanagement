# Generated by tools/build.py. Edit there, not here.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# STAGING: keep search engines out until launch. Delete this block at launch
# (the build removes it automatically when STAGING = False).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirect the bare domain to www
[[redirects]]
  from = "https://staycaymanagement.co.uk/*"
  to = "https://www.staycaymanagement.co.uk/:splat"
  status = 301
  force = true

# Short, memorable links
[[redirects]]
  from = "/appraisal"
  to = "/property-appraisal/"
  status = 301

[[redirects]]
  from = "/book-a-call"
  to = "https://calendly.com/REPLACE-ME/15min"
  status = 302

# OLD WEBSITE REDIRECTS: map every indexed URL from the current site to its
# closest new page before launch (see README launch checklist), e.g.
# [[redirects]]
#   from = "/old-page-name"
#   to = "/new-page/"
#   status = 301
